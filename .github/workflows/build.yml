name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt/audio system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 ffmpeg

      - name: Setup (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/setup_linux.sh

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/setup_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build_linux.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/build_windows.ps1

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../Audiobooker-linux.zip Audiobooker

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Audiobooker -DestinationPath Audiobooker-windows.zip

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobooker-linux
          path: Audiobooker-linux.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobooker-windows
          path: Audiobooker-windows.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag/name
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA::7}"
            echo "tag=build-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "name=Build #${GITHUB_RUN_NUMBER} (${short_sha})" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: artifacts/*.zip
